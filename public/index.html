<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Carded System — Encounter Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="encounter-meta">
          <div class="meta-label">Round</div>
          <div class="meta-value" data-round>1</div>
          <div class="meta-label">Combatants</div>
          <div class="meta-value" data-count>0</div>
        </div>
        <div class="turn-controls">
          <button type="button" id="startEncounter">Start Encounter</button>
          <button type="button" id="endEncounter">End Encounter</button>
          <button type="button" id="prevTurn">Prev Turn</button>
          <button type="button" class="primary" id="nextTurn">Next Turn</button>
        </div>
        <div class="header-actions">
          <button type="button" id="toggleAddForm">Add Combatant</button>
          <div class="rest-all">
            <button type="button" id="restAllShort">Short Rest All</button>
            <button type="button" id="restAllLong">Long Rest All</button>
          </div>
          <div class="gm-menu journal-menu">
            <button type="button" id="journalMenuToggle">Quest & Achievement ▾</button>
            <div class="gm-menu-panel journal-menu-panel" id="journalMenuPanel">
              <details class="journal-manager-group">
                <summary><strong>Create Quest</strong></summary>
                <form data-global-journal-form="quest" class="stacked-form">
                  <div class="form-row">
                    <label>Send To
                      <select name="target" data-global-journal-target>
                        <option value="participant">Individual Player</option>
                        <option value="all">All Players</option>
                      </select>
                    </label>
                    <label>Player
                      <select name="participantId" data-global-journal-participant></select>
                    </label>
                  </div>
                  <label>Quest Name
                    <input type="text" name="title" placeholder="Quest title" required />
                  </label>
                  <label>Description / Hook
                    <textarea name="narrative" rows="2" placeholder="Short narrative hook"></textarea>
                  </label>
                  <div class="form-row">
                    <label>Primary Objective
                      <input type="text" name="objectivePrimary" placeholder="Primary task" />
                    </label>
                    <label>Secondary Objective
                      <input type="text" name="objectiveSecondary" placeholder="Optional secondary task" />
                    </label>
                  </div>
                  <div class="form-row">
                    <label>Difficulty
                      <select name="difficulty">
                        <option value="">Select difficulty…</option>
                        <option>Common</option>
                        <option>Uncommon</option>
                        <option>Rare</option>
                        <option>Very Rare</option>
                        <option>Epic</option>
                      </select>
                    </label>
                    <label>Primary Reward
                      <input type="text" name="rewardPrimary" placeholder="XP / Card Shards / Relic / Currency / Unlock" />
                    </label>
                  </div>
                  <div class="form-row">
                    <label>Bonus Reward
                      <input type="text" name="rewardBonus" placeholder="Optional bonus reward" />
                    </label>
                    <label>Failure Condition
                      <input type="text" name="failureCondition" placeholder="Optional failure condition" />
                    </label>
                  </div>
                  <button type="submit">Create Quest</button>
                </form>
              </details>

              <details class="journal-manager-group">
                <summary><strong>Create Achievement</strong></summary>
                <form data-global-journal-form="achievement" class="stacked-form">
                  <div class="form-row">
                    <label>Send To
                      <select name="target" data-global-journal-target>
                        <option value="participant">Individual Player</option>
                        <option value="all">All Players</option>
                      </select>
                    </label>
                    <label>Player
                      <select name="participantId" data-global-journal-participant></select>
                    </label>
                  </div>
                  <label>Title
                    <input type="text" name="title" placeholder="Achievement name" required />
                  </label>
                  <label>Requirement
                    <textarea name="requirement" rows="2" placeholder="What the player did"></textarea>
                  </label>
                  <label>Reward
                    <input type="text" name="reward" placeholder="Passive Bonus / Title / Card / Relic" />
                  </label>
                  <label>Description / Flavor
                    <textarea name="flavor" rows="2" placeholder="Flavor text about the accomplishment"></textarea>
                  </label>
                  <button type="submit">Create Achievement</button>
                </form>
              </details>
            </div>
          </div>
          <div class="gm-menu">
            <button type="button" id="gmMenuToggle">Encounter Menu ▾</button>
            <div class="gm-menu-panel" id="gmMenuPanel">
              <button type="button" id="downloadEncounter">Download Encounter</button>
              <label class="file-upload">
                Import Encounter
                <input type="file" id="uploadEncounter" accept="application/json" />
              </label>
            </div>
          </div>
          <div class="gm-menu">
            <button type="button" id="helpMenuToggle">Help Menu ▾</button>
            <div class="gm-menu-panel help-menu-panel" id="helpMenuPanel">
              <button type="button" data-help-open="statuses">Statuses</button>
              <button type="button" data-help-open="combat">Combat Rules</button>
              <button type="button" data-help-open="out_of_combat">Out of Combat</button>
              <button type="button" data-help-open="cards">Cards</button>
            </div>
          </div>
          <a href="/player?create=1" target="_blank" rel="noopener noreferrer">New Character Sheet</a>
          <a href="/cards" target="_blank" rel="noopener noreferrer">Card Library</a>
          <a href="/player" target="_blank" rel="noopener noreferrer">Open Player Dashboard</a>
        </div>
      </header>
      <main class="main-grid">
        <aside class="turn-column">
          <section class="panel">
            <div class="panel-header">
              <h2>Turn Order</h2>
              <button type="button" id="refreshState">Refresh</button>
            </div>
          <div id="turnList" class="turn-list empty-state">No combatants yet.</div>
          <div id="addDrawer" class="drawer">
            <form id="addParticipantForm" class="stacked-form">
              <h3>Add Combatant</h3>
                <div class="form-row">
                  <label>Name
                    <input name="name" type="text" placeholder="Bladewalker" required />
                  </label>
                  <label>Initiative
                    <input name="initiative" type="number" value="0" />
                  </label>
                </div>
                <div class="form-row">
                  <label>Base HP
                    <input name="maxHp" type="number" value="20" />
                  </label>
                  <label>Base Shield
                    <input name="maxShield" type="number" value="0" />
                  </label>
                </div>
                <div class="form-row">
                  <label>Base AP
                    <input name="apMax" type="number" value="6" />
                  </label>
                  <label>Team
                    <select name="team">
                      <option value="">Unassigned</option>
                      <option value="Team 1">Team 1</option>
                      <option value="Team 2">Team 2</option>
                      <option value="Team 3">Team 3</option>
                      <option value="Team 4">Team 4</option>
                    </select>
                  </label>
                  <label>Set Focus
                    <input name="setFocus" type="text" placeholder="Elemental" />
                  </label>
                </div>
                <button type="submit" class="primary">Add Combatant</button>
            </form>
          </div>
        </section>
        </aside>
        <section class="detail-column">
          <div id="detailPanel" class="panel detail-panel empty-state">
            Select a combatant to manage their turn, automation, and cards.
          </div>
          <section class="panel log-panel">
            <div class="panel-header collapsible">
              <h2>Action Log</h2>
              <button type="button" id="toggleLog">Hide</button>
            </div>
            <div id="logList" class="log-list"></div>
          </section>
        </section>
      </main>
    </div>
    <div id="helpModal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="helpModalTitle">
      <div class="help-modal-card">
        <div class="help-modal-header">
          <h2 id="helpModalTitle">Help</h2>
          <button type="button" id="helpModalClose">Close</button>
        </div>
        <div class="help-tab-row" id="helpModalTabs">
          <button type="button" class="help-tab" data-help-tab="statuses">Statuses</button>
          <button type="button" class="help-tab" data-help-tab="combat">Combat Rules</button>
          <button type="button" class="help-tab" data-help-tab="out_of_combat">Out of Combat</button>
          <button type="button" class="help-tab" data-help-tab="cards">Cards</button>
        </div>
        <div id="helpModalBody" class="help-modal-body"></div>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
